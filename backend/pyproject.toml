[project]
name = "backend"
version = "0.1.0"
description = "Video dialogue extraction backend"
readme = "README.md"
requires-python = ">=3.14"

dependencies = [
    "alembic>=1.19.1",
    "curl-cffi>=0.11",
    "fastapi>=0.141.1",
    "faster-whisper>=1.2.1",
    "opencv-python>=5.0.0.93",
    "psycopg[binary]>=3.3.4",
    "sqlalchemy>=2.0.52",
    "uvicorn>=0.52.4",
    "yt-dlp>=2026.8.19",
]

[tool.uv]
package = false
