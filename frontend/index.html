<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Quest1 Dialogue Finder</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&display=swap"
    rel="stylesheet">

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <main class="app">

    <!-- =====================================================
         HEADER
         ===================================================== -->

    <header class="header">

      <div class="brand">
        QUEST1
      </div>

      <div class="header-label">
        DIALOGUE FINDER
      </div>

    </header>


    <!-- =====================================================
         HERO
         ===================================================== -->

    <section class="hero">

      <div class="eyebrow">
        VIDEO ANALYSIS
      </div>

      <h1>
        FIND THE<br>
        EXACT FRAME
      </h1>

      <p class="description">
        Locate the exact video frame where
        a dialogue appears.
      </p>

    </section>


    <!-- =====================================================
         INPUT
         ===================================================== -->

    <section class="input-section">

      <div class="field">

        <label for="video-url">
          VIDEO URL
        </label>

        <input id="video-url" type="url" placeholder="https://youtube.com/..." autocomplete="off">

      </div>


      <div class="field">

        <label for="dialogue">
          DIALOGUE
        </label>

        <textarea id="dialogue" rows="3" placeholder="Enter the dialogue to find..."></textarea>

      </div>


      <button id="find-button" type="button">
        FIND EXACT FRAME
      </button>

    </section>


    <!-- =====================================================
         STATUS
         ===================================================== -->

    <section id="status" class="status hidden" aria-live="polite">

      <span class="status-indicator"></span>

      <span id="status-text">
        Processing...
      </span>

    </section>


    <!-- =====================================================
         ERROR
         ===================================================== -->

    <section id="error" class="error hidden" aria-live="assertive">

      <span id="error-text"></span>

    </section>


    <!-- =====================================================
         RESULT
         ===================================================== -->

    <section id="result" class="result hidden">

      <div class="section-heading">
        RESULT
      </div>


      <!-- =================================================
           MATCHED DIALOGUE
           ================================================= -->

      <div class="matched-dialogue">

        <span class="quote-mark">"</span>

        <span id="result-text"></span>

        <span class="quote-mark">"</span>

      </div>


      <!-- =================================================
           EXACT FRAME
           ================================================= -->

      <div class="frame-container">

        <img id="frame-image" src="" alt="Extracted video frame">

      </div>


      <!-- =================================================
           METADATA
           ================================================= -->

      <div class="metadata">

        <div class="metadata-item">

          <span class="metadata-label">
            DIALOGUE TIMELINE
          </span>

          <span id="result-timestamp" class="metadata-value"></span>

        </div>


        <div class="metadata-item">

          <span class="metadata-label">
            FRAME
          </span>

          <span id="result-frame" class="metadata-value"></span>

        </div>

      </div>


      <!-- =================================================
           FULL VIDEO
           ================================================= -->

      <div class="video-section">

        <div class="video-container">

          <video id="video-player" controls preload="metadata"></video>

        </div>


        <!-- Dialogue range -->
        <div class="timeline">

          <div class="timeline-track">

            <div id="dialogue-range" class="dialogue-range"></div>

            <div id="timeline-pointer" class="timeline-pointer"></div>

          </div>

        </div>


        <!-- <div class="timeline-label"> -->
        <!---->
        <!--   <span> -->
        <!--     DIALOGUE -->
        <!--   </span> -->
        <!---->
        <!--   <span id="timeline-start"> -->
        <!--     00:00.00 -->
        <!--   </span> -->
        <!---->
        <!--   <span> -->
        <!--     → -->
        <!--   </span> -->
        <!---->
        <!--   <span id="timeline-end"> -->
        <!--     00:00.00 -->
        <!--   </span> -->
        <!---->
        <!-- </div> -->

      </div>

    </section>


    <!-- =====================================================
         FOOTER
         ===================================================== -->

    <footer class="footer">

      <span>
        QUEST1
      </span>

      <span>
        EXACT FRAME DETECTION
      </span>

    </footer>

  </main>


  <script src="app.js"></script>

</body>

</html>
